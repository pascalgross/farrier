#cloud-config

# A first-boot baseline: unattended security updates, a wheel group, su restricted to it, and one
# administrator in that group. It is an example rather than a default — Farrier ships no template, and
# a baseline is a decision somebody makes about their own fleet.
#
# Farrier stores and renders this and never delivers it. The rendered user-data goes to whatever creates
# the machine — a hypervisor, Terraform, MAAS, a provider's user-data field — and cloud-init applies it
# at first boot. There is no path from the control plane to an already-running host; see
# docs/SECURITY.md section 7.
#
# {{admin_user}} is a substitution site, filled in by POST /api/v1/templates/{name}/render. Substitution
# is textual, so the value is the operator's to get right: it lands in a YAML document and in a group
# name, and a rendered document is read by the person who pastes it. A template used as a Tier 2
# bootstrap (`farrier enroll --bootstrap`) is applied as exactly the bytes that were signed, so replace
# the placeholder with a literal name *before* `farrier sign-template` rather than expecting a host to
# fill it in.

package_update: true

# wheel does not exist on Debian or Ubuntu, and nothing below creates it implicitly.
groups:
  - wheel

packages:
  # Present on Ubuntu, absent on a minimal Debian. Naming it is idempotent and makes the document say
  # what it depends on rather than assuming a base image.
  - unattended-upgrades

write_files:
  # The two periodic keys are the whole of "unattended-upgrades is on". The package ships the machinery
  # and this file is what apt-daily-upgrade.service reads before doing anything.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # 52 rather than 49: apt reads this directory in lexical order and the distribution's own file is
  # 50unattended-upgrades, so a lower number would be overridden by the file this one means to amend.
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root:root
    permissions: '0644'
    content: |
      // Keep the installed conffile when a package ships a changed one, and never stop to ask: an
      // unattended run has no terminal, and a dpkg prompt there is a host that stops applying security
      // updates until somebody notices.
      Dpkg::Options {
        "--force-confdef";
        "--force-confold";
      };

      // Wait for the dpkg lock rather than failing the run. The common collision is this host's own
      // apt-daily timer, and a run that failed on a lock is a run that did not happen.
      DPkg::Lock::Timeout "600";
      Acquire::Retries "3";

      // A reboot is not the update mechanism's decision. Farrier reports that one is required, and
      // `host.reboot` is a destructive intent bounded by the host's own /etc/farrier/policy.toml —
      // which is the only place that answer belongs.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

      // Unattended-Upgrade::Origins-Pattern is deliberately not set here. Debian and Ubuntu name their
      // security origins differently, the distribution's own 50unattended-upgrades already has the
      // right one, and a pattern copied from the other distribution is how a host silently stops
      // applying security updates while still reporting that unattended-upgrades is enabled.

  # The administrator's name as data, in a file, rather than spliced into the command line below. A
  # rendered value is text somebody supplied; read back with "$(cat ...)" it reaches usermod as one
  # argument whatever it contains.
  - path: /run/farrier-baseline/wheel-member
    owner: root:root
    permissions: '0600'
    content: |
      {{admin_user}}

  - path: /run/farrier-baseline/apply.sh
    owner: root:root
    permissions: '0700'
    content: |
      #!/bin/sh
      # Restrict su to the wheel group, put the administrator in it, and then prove both.
      #
      # A script rather than three runcmd lines, because the last third is the part that matters: a
      # baseline that quietly did nothing is worse than one that failed, and a non-zero exit here is
      # what makes `cloud-init status --long` report this boot as degraded.
      set -eu

      pam_su=/etc/pam.d/su
      wheel_line='auth       required   pam_wheel.so use_uid group=wheel'

      # pam_wheel with "required" *restricts* su to wheel members; it grants nothing. The other reading
      # of "allow su for wheel" is `auth sufficient pam_wheel.so trust use_uid`, which lets a wheel
      # member become root with no password at all. That one is not here on purpose.

      # Whether *this* rule is in place — not merely some pam_wheel rule.
      #
      # The difference is the whole reason this is a function rather than a grep. An image may already
      # carry `auth required pam_wheel.so deny group=nosu`, which forbids su to one group and says
      # nothing about wheel; a pattern that matched any pam_wheel line would take that for "installed",
      # skip the edit, and then pass the assertion below on a host where wheel controls nothing at all.
      # Per line rather than per file, because both rules together are a legitimate configuration.
      wheel_rule_present() {
        awk '
          $1 == "auth" && $2 == "required" && $3 == "pam_wheel.so" {
            group = 0; deny = 0
            for (i = 4; i <= NF; i++) {
              if ($i == "group=wheel") group = 1
              if ($i == "deny") deny = 1
            }
            if (group && !deny) found = 1
          }
          END { exit !found }
        ' "$1"
      }

      if wheel_rule_present "$pam_su"; then
        :
      elif grep -qE '^[[:space:]]*auth[[:space:]]+sufficient[[:space:]]+pam_rootok\.so' "$pam_su"; then
        # Immediately after pam_rootok, which is sufficient and short-circuits, so root keeps its
        # unauthenticated su and everyone else meets the wheel check before the password prompt.
        sed -i -E "0,/^[[:space:]]*auth[[:space:]]+sufficient[[:space:]]+pam_rootok\.so.*$/s//&\n$wheel_line/" \
          "$pam_su"
      else
        # No pam_rootok line to anchor to. Appending still works — the auth stack is evaluated in full
        # and "required" must pass wherever it sits — it just asks for the password first.
        printf '%s\n' "$wheel_line" >> "$pam_su"
      fi

      user=$(cat /run/farrier-baseline/wheel-member)
      usermod --append --groups wheel "$user"

      # Four assertions, one per thing that can silently not have happened: the PAM edit, the group
      # membership, the periodic key apt itself parses back, and the timer that runs the upgrade.
      wheel_rule_present "$pam_su"
      id -nG "$user" | tr ' ' '\n' | grep -qx wheel
      apt-config dump APT::Periodic::Unattended-Upgrade | grep -q '"1"'
      systemctl is-enabled apt-daily-upgrade.timer > /dev/null

runcmd:
  # Argument vectors rather than shell strings, here and in every other Farrier document that runs
  # something: a list is arguments, a string is a command line somebody else's value can end up in.
  - [ systemctl, enable, --now, apt-daily.timer, apt-daily-upgrade.timer ]
  - [ sh, /run/farrier-baseline/apply.sh ]
