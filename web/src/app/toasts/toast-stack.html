<!--
  aria-live="polite" rather than "assertive": a screen reader should finish the sentence it is on
  before being told a unit failed. The events themselves are never urgent enough to interrupt
  somebody mid-word, and the inbox holds every one of them.
-->
<div class="hostseal-toasts" role="status" aria-live="polite">
  @for (event of toasts(); track event.id) {
    <article class="hostseal-toast">
      <mat-icon [class]="tone(event)" aria-hidden="true">{{ icon(event) }}</mat-icon>

      <div class="min-w-0 flex-1">
        <p class="m-0 text-sm">{{ event.summary }}</p>
        <p class="m-0 mt-1 text-xs opacity-70 hostseal-numeric">
          {{ label(event) }}
          @if (event.hostId) {
            ·
            <a [routerLink]="['/hosts', event.hostId]" (click)="dismiss(event.id)">
              {{ event.hostname || event.hostId }}
            </a>
          } @else {
            · <a routerLink="/events" (click)="dismiss(event.id)">All events</a>
          }
        </p>
      </div>

      <button mat-icon-button type="button"
              [attr.aria-label]="'Dismiss this notification: ' + event.summary"
              (click)="dismiss(event.id)">
        <mat-icon>close</mat-icon>
      </button>
    </article>
  }
</div>
