# PostgreSQL settings for a HostSeal control plane, included from the end of the generated
# postgresql.conf by initdb/00-include-hostseal-conf.sh.
#
# It is an include rather than a replacement because the official image writes a postgresql.conf that
# initdb tuned to the container it is in — shared_buffers, the collation provider, the timezone. A
# hand-written file that replaced it would silently drop whatever the next image release starts putting
# in there. Included last, so every setting below wins.
#
# The theme of this file is that the settings which cannot be turned on later without a restart are on
# from the first start. A control plane that has to be stopped before it can grow a replica is one whose
# replica gets postponed.

# --- Write-ahead logging, and what a standby needs from it -------------------------------------------

# The default since PostgreSQL 10, stated anyway: the whole point of this file is that somebody reading
# it can see what the cluster promises a standby without going and looking up which release changed
# which default.
wal_level = replica

# Room for the walsenders a standby, a pg_basebackup and an ad-hoc pg_receivewal need at once. Ten is
# far more than a two-node pair uses; it costs a small amount of shared memory and it cannot be raised
# without a restart, which is exactly the property this file is trying to avoid.
max_wal_senders = 10

# Physical slots for standbys, and logical ones for anything that wants a change stream later. A slot is
# what stops the primary recycling WAL a standby has not read yet — the failure it prevents is a standby
# that falls behind during a long night and can then never catch up without a fresh base backup.
max_replication_slots = 10

# A floor under how much WAL is kept even without a slot, so a standby that is briefly disconnected —
# a reboot, a network partition — recovers by reconnecting rather than by being rebuilt. Slots make this
# unnecessary in the steady state; it is here for the window before a slot exists, which is precisely
# when the first standby is being set up.
wal_keep_size = 1GB

# Read-only queries on a standby. On by default, and load-bearing for the reason anybody adds one to a
# control plane: reporting across a fleet is read-heavy, and it does not have to run on the primary.
hot_standby = on

# What pg_rewind needs to exist in the WAL. Without it, a promoted standby and the old primary can only
# be reconciled by a full base backup — so a failover that turned out to be unnecessary costs a rebuild
# of a database that was fine. It is not free (a few percent more WAL) and it cannot be turned on
# without a restart.
wal_log_hints = on

# --- Archiving ---------------------------------------------------------------------------------------

# On, and archiving nothing. archive_mode cannot be changed without restarting the cluster, while
# archive_command is a reload — so turning this on now is what makes point-in-time recovery a
# configuration change later rather than a maintenance window.
#
# Replace archive_command with something that copies %p somewhere durable and exits non-zero when it
# fails; see deploy/README.md. Two things about that command are worth knowing before you write one: a
# command that fails makes WAL accumulate until the volume fills, and a command that succeeds without
# copying anything is how a backup is discovered to be empty at restore time. /bin/true below is the
# second of those, deliberately and visibly.
archive_mode = on
archive_command = '/bin/true'

# --- Checkpoints -------------------------------------------------------------------------------------

# A control plane writes steadily rather than in bursts: a heartbeat per host per minute, plus job rows
# and results. The defaults checkpoint often enough on that workload to keep a standby's replay busy
# with full-page images; these spread the same work out.
max_wal_size = 2GB
checkpoint_timeout = 15min

# --- Synchronous replication, deliberately not enabled -----------------------------------------------

# Uncomment on a pair where losing an acknowledged write is worse than losing availability, and be sure
# which of the two you mean: with one standby named here and that standby down, every commit blocks.
# For a fleet manager the usual answer is that it is not worth it — a lost heartbeat is re-sent a minute
# later, and a lost job result is re-sent by the agent, which spools results to disk before it acts.
# synchronous_standby_names = 'FIRST 1 (standby1)'
# synchronous_commit = on

# --- Row-level security is the tenant boundary -------------------------------------------------------

# Nothing to configure and everything to get wrong: hostseal-server must connect as an ordinary role.
# A superuser, or a role with BYPASSRLS, is exempt from every policy in the schema and every query
# returns every fleet's rows. initdb/10-hostseal-role.sh creates that role; the server checks its own
# privileges at startup and refuses to run on either kind. See docs/SECURITY.md §5.
