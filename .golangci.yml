# golangci-lint configuration for Farrier.
#
# Two things here are load-bearing rather than taste. revive's `exported` rule enforces the doc-comment
# rule on exported declarations; `tools/doccheck` extends the same rule to unexported ones, because no
# off-the-shelf linter does that and the unexported helper is exactly where a reader most needs to know
# why the code exists. Neither of them can check whether the "why" is real — that is code review's job,
# and CONTRIBUTING.md says so rather than pretending a linter covers it.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unused

  settings:
    depguard:
      # A closed set of forbidden imports, in the same spirit as the intent catalogue: the packages
      # nobody should reach for, named with the reason, rather than discovered in review.
      rules:
        main:
          deny:
            - pkg: golang.org/x/crypto/openpgp
              desc: >-
                Unmaintained and unsafe by design (GO-2026-5932), with no fixed version. Farrier signs
                the APT repository by calling gpg from packaging/apt/mkapt.sh and verifies job
                signatures with ed25519 through internal/signing; neither needs OpenPGP in Go. This
                rule exists because x/crypto is already a dependency, so the import would compile.
            - pkg: os/exec
              desc: >-
                Every process Farrier starts goes through internal/run, which holds the closed
                allowlist the guarantee in docs/SECURITY.md section 1 rests on. internal/run itself is
                excluded below.
            - pkg: golang.org/x/sys/unix
              desc: >-
                The same rule as os/exec, for the same reason and one spelling further out. This
                package offers Exec, Execve and Fexecve, so importing it makes execve reachable without
                importing os/exec at all - and it is already an indirect dependency, so the import
                would compile. Nothing in Farrier needs it: the one raw system call the code makes is
                SO_PEERCRED in internal/privsep, through the standard library's syscall package.

    revive:
      # Farrier's own rule is stricter than any of these; revive covers the exported half and the
      # sentence shape, and doccheck covers the rest.
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: receiver-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

    godot:
      # Declaration comments only. Farrier's rule is about doc comments; requiring a full stop on every
      # inline comment inside a function would produce churn without producing clarity.
      scope: declarations
      capital: false

    gosec:
      excludes:
        # G304 flags reading a file whose path is a variable. Farrier does that constantly and on
        # purpose — policy files, trusted-signers, pending results — with paths that are package
        # constants or derived from them, and the guarantee suite is what actually checks that.
        - G304

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx

      # internal/run is the one place allowed to start a process, and the source-level guarantee test
      # in internal/intent asserts that it stays the only one. The deny rule above is the cheap check
      # that fires in a contributor's editor; that test is the one that cannot be silenced with a
      # configuration edit.
      - path: internal/run/run\.go
        linters:
          - depguard

      # The test fleet and the doc-comment checker are build tooling rather than agent code, and both
      # legitimately run other programs.
      - path: tools/
        linters:
          - depguard

      # ffi.go is the one file in the repository that hands Go memory to a C ABI, and it is one file
      # for exactly this reason: G103 fires on every unsafe.Pointer in a PKCS#11 attribute template
      # and can say nothing useful about any of them. What makes them safe is a property gosec cannot
      # see — the module does not retain a pointer past the call — and what actually checks it is
      # TestTheCTypesAreTheSizeCExpects plus the round-trip tests against a real module, under both
      # CGO_ENABLED settings. Scoping the exclusion to this one path is what keeps the alternative
      # off the table: dozens of //nolint directives, each of which would have to carry a reason for
      # its own case and none of which would have a different one.
      - path: internal/signing/backend/pkcs11/ffi\.go
        linters:
          - gosec

      # comcall_windows.go is the second file that hands memory across an ABI boundary, and it is one
      # file for the same reason ffi.go is. govet's unsafeptr check fires on every uintptr-to-pointer
      # conversion reading a COM VARIANT, and can say nothing useful about any of them: a VARIANT is a
      # tagged union, so its value slot must be uintptr for the integer cases, and a BSTR or an
      # interface pointer read out of it necessarily starts life as one. What makes those conversions
      # safe is a property govet cannot see — the memory belongs to oleaut32's allocator, not to Go's
      # heap, so the collector will never move or free it — and every read is guarded by the VARIANT's
      # own type tag before the slot is touched at all.
      #
      # gosec is excluded for the narrower reason it is elsewhere: G103 on the same conversions, and
      # G115 on the deliberate 32-bit reinterpretations an HRESULT and a VARIANT_BOOL require.
      # TestGuaranteeTheVariantLayoutMatchesWindows is what actually checks the part that could be
      # wrong, and it runs on every platform.
      - path: internal/wua/comcall_windows\.go
        linters:
          - govet
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pascalgross/farrier
