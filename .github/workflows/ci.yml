# The checks every pull request runs.
#
# Each job calls a Makefile target rather than repeating its commands, so that "what does CI do" is
# answerable by reading the Makefile and a contributor can run the same thing locally. A CI file that
# drifts from what people run on their machines is one that fails for reasons nobody can reproduce.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range between base and head is checked, so the history has to be there.
          fetch-depth: 0
      - name: Every commit is signed off
        # Through the environment rather than through ${{ }}: an interpolated value is pasted into the
        # script before bash reads it, and a git branch name may legally contain a semicolon or a
        # backtick. Nothing here is attacker-chosen today — a pull request can only target a branch that
        # already exists — but "not exploitable because of a fact about GitHub" is a worse reason to be
        # safe than "the value never reaches the parser".
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/dco-check.sh "origin/$BASE_REF" "$HEAD_SHA"

  go:
    name: Go
    runs-on: ubuntu-latest

    services:
      # The store tests skip without this, so that `go test ./...` works on a machine with no database.
      # They are not optional here: the PostgreSQL behaviour the store depends on — atomic claiming,
      # LISTEN/NOTIFY, conditional updates — is not exercised by the in-memory store at all, and a
      # suite that only ran against Memory would prove nothing about the code that ships.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farrier_test
          POSTGRES_PASSWORD: farrier_test
          POSTGRES_DB: farrier_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farrier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FARRIER_TEST_DATABASE_URL: postgres://farrier_app:farrier_app@127.0.0.1:5432/farrier_app?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create a database role that row-level security applies to
        # The postgres image's POSTGRES_USER is the cluster's bootstrap superuser, and a superuser is
        # exempt from every row-level security policy in the schema — with no symptom. Tenant isolation
        # *is* those policies, so tests run as that role cannot observe the thing they exist to observe;
        # TestGuaranteeRowLevelSecurityIsTheRuleNotThePredicate fails rather than skipping in that
        # state, which is how this was found.
        #
        # The bootstrap user cannot drop its own SUPERUSER attribute — PostgreSQL refuses, and that is
        # not a permissions accident but a rule about the bootstrap role. So the tests get an ordinary
        # role of their own, owning its own database. That is also exactly what docs/INSTALL.md tells an
        # operator to do, which means CI now runs against the documented production arrangement rather
        # than a more privileged one.
        env:
          PGPASSWORD: farrier_test
        run: |
          psql -h 127.0.0.1 -U farrier_test -d farrier_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE farrier_app LOGIN PASSWORD 'farrier_app';
          CREATE DATABASE farrier_app OWNER farrier_app;
          SQL
          PGPASSWORD=farrier_app psql -h 127.0.0.1 -U farrier_app -d farrier_app -tAc \
            'SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user;' \
            | grep -qx f

      - name: A PKCS#11 module the signing-backend tests can drive
        # libsofthsm2 rather than softhsm2: the tests build their own token through the module's own
        # entry points, so softhsm2-util is not needed. Not optional — a skipped backend test is
        # indistinguishable from a passing one in a summary, and the step below checks it actually ran.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsofthsm2

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: Doc comments on every type and function, exported or not
        run: make doccheck

      - name: An unprivileged runner may bind 465, so the implicit-TLS test does not skip
        # The mail sink chooses its transport on an exact port comparison, and the only way to observe
        # the implicit-TLS half is a listener on 465 itself — which is privileged, so on a runner it
        # skips, and a skipped test reads exactly like a passing one. Lowering the threshold for the
        # job is cheaper than a seam in the production code, and FARRIER_TEST_PRIVILEGED_PORTS turns
        # the test's skip into a failure so that a runner where this step stops working says so.
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=465

      - name: Tests, including the store against a real PostgreSQL
        env:
          FARRIER_TEST_PRIVILEGED_PORTS: "1"
        run: make test

      - name: The store tests actually ran rather than skipping
        # A skipped test is indistinguishable from a passing one in a summary, and these are the only
        # coverage the production store has.
        #
        # The second name is checked separately because it is the one that must not be wrong: it
        # asserts that a job's signed payload canonicalises to the same bytes after a round trip
        # through jsonb as it did when it was signed. Its PostgreSQL half is what makes it worth
        # having, and a silent skip there would leave a correct signature failing on a host, looking
        # like a broken key.
        run: |
          go test -count=1 -v ./internal/store/ \
            -run 'TestClaimJobsDeliversEachJobExactlyOnce|TestGuaranteeAStoredJobCanonicalisesToWhatWasSigned' \
            | tee /tmp/store.log
          for name in \
            '--- PASS: TestClaimJobsDeliversEachJobExactlyOnce' \
            '--- PASS: TestGuaranteeAStoredJobCanonicalisesToWhatWasSigned/postgres'; do
            grep -q -- "$name" /tmp/store.log \
              || { echo "the PostgreSQL store tests skipped: $name did not run" >&2; exit 1; }
          done

      - name: The PKCS#11 backend, against a real module and in the build that ships
        # `make test` above runs with cgo, because -race requires it. The released binary is built
        # CGO_ENABLED=0 and reaches the module through purego's own dlopen, which nothing else here
        # exercises — so this target runs both, and the grep is because a skipped test reads as a
        # passing one.
        run: |
          make test-pkcs11 | tee /tmp/pkcs11.log
          grep -q -- '--- PASS: TestSignAndVerifyRoundTrip' /tmp/pkcs11.log \
            || { echo "the PKCS#11 backend tests skipped: no module was found" >&2; exit 1; }

      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        # Installed through the Makefile rather than an action, so that CI runs the same binary and the
        # same target a contributor runs locally — and at the version the Makefile pins. It used to
        # install @latest, which made that claim false: a linter release could fail a pull request that
        # changed nothing, with findings the author could not reproduce.
        run: make golangci-install

      - name: golangci-lint
        run: make golangci

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Given explicitly because there is no package.json at the repository root and no
          # packageManager field for the action to read, so without it the step fails before it starts.
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: ESLint, including the doc-comment rule on private members
        run: pnpm exec eslint .

      - name: Unit tests
        # Chrome comes with the runner image. The karma launcher passes --no-sandbox because CI and
        # containers often run as root, where Chrome refuses to start otherwise.
        run: pnpm exec ng test --watch=false

      - name: Production build
        run: pnpm run build

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Every systemd unit is valid
        # systemd silently ignores a directive it does not understand and will happily start a unit
        # whose sandboxing was dropped by a typo. That applies to the three helper sockets as much as to
        # the agent, and the sockets are now the privilege boundary: a socket unit that does not parse
        # is a host that cannot be patched.
        run: |
          sudo install -Dm755 /bin/true /usr/bin/farrier-agent
          for helper in apply-updates restart-unit reboot-host; do
            sudo install -Dm755 /bin/true "/usr/libexec/farrier/$helper"
          done
          make units

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build the .deb
        run: make deb VERSION=0.0.0-ci

      - name: Install it, and check the agent runs and the helper refuses
        run: |
          # `make deb-path` rather than a literal: Debian has no notion of a prerelease, so nfpm's
          # semver schema writes 0.0.0-ci as 0.0.0~ci, and a hand-written path silently matches nothing.
          sudo dpkg -i "$(make -s deb-path VERSION=0.0.0-ci)"
          farrier-agent version
          farrier version
          farrier-agent policy check

          # The privilege boundary, from the agent's own account. This connects to each of the three
          # helper sockets and is refused by each, which proves the sockets exist, that this account may
          # reach them, that systemd started the helper as root, and that the helper refuses what it
          # does not serve. It changes nothing: the intent it sends is in no catalogue.
          sudo -u farrier farrier-agent doctor

          # And the whole product in one command: an operation the local policy does not permit, going
          # through the only privileged path that exists, being told no by a file the control plane
          # cannot touch.
          set +e
          sudo /usr/libexec/farrier/restart-unit --action restart --unit nginx.service
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "expected exit 3 (refused by local policy), got $status" >&2
            exit 1
          fi

      - name: A local edit to policy.toml and trusted-signers survives an upgrade
        # This is a security test rather than a convenience one. A package upgrade that silently reset
        # the trust anchor would re-open every destructive operation an administrator had closed.
        run: |
          printf '\ned25519 AAAAC3NzaC1lZDI1NTE5AAAAILOCALEDITXXXXXXXXXXXXXXXXXXXXXXXXXXXX local\n' \
            | sudo tee -a /etc/farrier/trusted-signers > /dev/null
          sudo sed -i 's/^allow = "security"/allow = "all"/' /etc/farrier/policy.toml
          before_policy=$(md5sum /etc/farrier/policy.toml | cut -d' ' -f1)
          before_signers=$(md5sum /etc/farrier/trusted-signers | cut -d' ' -f1)

          make deb VERSION=0.0.1-ci
          sudo dpkg -i "$(make -s deb-path VERSION=0.0.1-ci)"

          after_policy=$(md5sum /etc/farrier/policy.toml | cut -d' ' -f1)
          after_signers=$(md5sum /etc/farrier/trusted-signers | cut -d' ' -f1)
          [ "$before_policy" = "$after_policy" ] || { echo "policy.toml was replaced" >&2; exit 1; }
          [ "$before_signers" = "$after_signers" ] || { echo "trusted-signers was replaced" >&2; exit 1; }
          echo "conffiles survived the upgrade"

      - name: Purge leaves nothing behind
        run: |
          sudo dpkg --purge farrier-agent
          for path in /etc/farrier /var/lib/farrier /usr/libexec/farrier /usr/bin/farrier \
                      /usr/share/farrier /usr/lib/systemd/system/farrier-apply-updates.socket \
                      /usr/lib/tmpfiles.d/farrier.conf; do
            [ ! -e "$path" ] || { echo "$path survived a purge" >&2; exit 1; }
          done
          # An enabled socket unit left behind would activate a binary that no longer exists, turning
          # every connection into a failed unit start on a machine where Farrier is not installed.
          for socket in farrier-apply-updates farrier-restart-unit farrier-reboot-host; do
            if systemctl is-enabled "$socket.socket" >/dev/null 2>&1; then
              echo "$socket.socket is still enabled after a purge" >&2; exit 1
            fi
          done
          ! getent passwd farrier

  apt-repository:
    name: APT repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm and apt-utils
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils

      - name: Build a package and a signed repository
        # An ephemeral key rather than the release secret: this proves the mechanism on every pull
        # request without any pull request being able to reach the key that signs real packages.
        run: |
          make deb VERSION=0.0.0-ci
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          gpg --batch --quick-generate-key --passphrase '' \
            "Farrier CI <ci@example.invalid>" default default never
          KEY=$(gpg --list-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          GPG_KEY_ID="$KEY" FARRIER_APT_URL="https://apt.example.invalid" \
            ./packaging/apt/mkapt.sh dist/packages ./public

      - name: apt verifies the repository and installs from it
        run: |
          sudo install -m0644 ./public/farrier-archive-keyring.gpg \
            /usr/share/keyrings/farrier-archive-keyring.gpg
          sudo sed "s|https://apt.example.invalid|file://$PWD/public|" \
            ./public/farrier.sources | sudo tee /etc/apt/sources.list.d/farrier.sources > /dev/null
          sudo apt-get -o APT::Sandbox::User=root update
          sudo apt-get -o APT::Sandbox::User=root install -y --no-install-recommends farrier-agent
          farrier-agent version
