# The runtime directory the three helper sockets live in.
#
# It is created here rather than by RuntimeDirectory= on the socket units, because three units each
# declaring the same runtime directory would have the first one to stop delete it out from under the
# other two.
#
# /run is a tmpfs, so the directory and every socket in it are gone after a reboot and recreated before
# sockets.target. A stale socket file surviving a crash would be a path the agent connects to and
# nothing answers on, which is a much worse failure than a missing one: the agent would block rather
# than report.
d /run/farrier 0755 root root -
