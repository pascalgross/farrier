# Farrier local policy.
#
# This file is the authority on this host. It is owned root:root, the farrier agent cannot write it,
# and no operation in Farrier's intent catalogue can modify it. Effective permission for any job is
# min(what the control plane asked for, what this file allows) — never the maximum. A host set to
# allow = "none" cannot be made to apply updates by anyone in the control plane holding any role,
# ever, including the person who installed it.
#
# It is shipped as a dpkg conffile, so your edits survive package upgrades. If you change it, run
# `farrier-agent policy check` to validate before restarting the agent: a file that does not parse
# causes the host to refuse all privileged work rather than fall back to a default, which is deliberate
# and is a miserable way to discover a typo.
#
# Full reference: /usr/share/doc/farrier-agent/SECURITY.md, or docs/SECURITY.md in the source tree.

[updates]

# How far this host will go in applying package updates.
#
#   none      refuse every update application, from anyone
#   security  apply updates from the distribution's security origins only
#   all       apply every available update
allow = "security"

# Whether this host applies permitted updates on its own timer, without being asked.
#
# This is what keeps a fleet patched through a control-plane outage. It is a separate setting from
# `allow` because the two answer different questions: `allow` bounds what the control plane may ask
# for, `auto_apply` decides whether the host also acts unprompted.
#
# NOT YET IMPLEMENTED. The timer that applies updates unprompted belongs to unattended-upgrades, which
# the distribution configures and Farrier currently does not touch, so this setting is reported to the
# control plane and acted on by nothing. It is here from the first release because it belongs in this
# file, and because adding a policy key later means every host in a fleet has a policy file older than
# the software reading it.
auto_apply = true

# The maintenance window, in the timezone below. Empty means any time.
#
# Accepted forms:
#   ""                      always open
#   "Sun 03:00-05:00"       one day
#   "Mon-Fri 02:00-04:00"   a range of days
#   "Sat,Sun 00:00-06:00"   a list of days
#   "Sat 22:00-02:00"       crossing midnight, into Sunday morning
#   "daily 03:00-05:00"     every day
window = ""

# The IANA timezone the window above is expressed in.
#
# It is explicit rather than inherited from the host clock, because in a fleet spanning regions
# "03:00" silently meaning two different hours on two hosts is discovered during the outage rather
# than before it.
timezone = "UTC"

# Whether and when this host will reboot on request.
#
#   never   refuse every reboot request
#   window  reboot only inside the maintenance window above
#
# "window" requires `window` above to be set. An empty window is always open, so the combination would
# mean "reboot at any time" — which is not what anybody writing `reboot = "window"` meant, and is the
# sort of thing discovered by a host rebooting at eleven on a Tuesday morning. There is deliberately no
# `reboot = "always"`: if you really want that, say so in the window.
#
# The shipped default is "never". A fresh install should be able to report on a host and keep it
# patched, and should be able to do nothing else until somebody decides otherwise.
reboot = "never"

[services]

# Units this host will start, stop or restart on request.
#
# Entries are matched with shell-style globbing, so "farrier-*.service" covers instances without
# enumerating them. The shipped default is empty: nothing is restartable until you say what is.
#
# Example:
#   restartable = ["nginx.service", "docker.service", "farrier-*.service"]
restartable = []

# Units whose state changes this host considers worth reporting as an event.
#
# Matched the same way as `restartable`, and deliberately with the opposite default: empty means
# *every* unit. Permitting an action and reporting a fact are different questions, and a fresh host
# should surface a failed unit rather than hide it behind a setting nobody has heard of.
#
# Write a list when the noise is not worth it — a machine whose timers fail routinely, say — and the
# host will keep quiet about everything else. It bounds what the control plane says about this host,
# never what may be done to it, so widening it is not a permission change. The full unit list still
# rides the heartbeat either way; this decides what becomes an event.
#
# Example:
#   watched = ["nginx.service", "postgresql*.service"]
watched = []

[limits]

# How long after issue a job may still be executed.
#
# It bounds the damage of a job that sat in a queue across an outage: a restart signed on Tuesday
# should not execute on Friday because this host was offline in between. It is enforced here, locally,
# so that it holds even when the control plane is the thing that went wrong.
max_job_age_seconds = 900
