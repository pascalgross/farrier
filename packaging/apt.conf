// Farrier's apt configuration for update runs. Installed as /usr/share/farrier/apt.conf and named by
// APT_CONFIG in the environment of the two programs helpers/apply-updates invokes. It is NOT installed
// into /etc/apt/apt.conf.d: Farrier configures nothing about the host's own apt, and a fragment there
// would change every apt-get anybody ran, for ever.
//
// It exists because unattended-upgrade accepts no -o. Its whole option set is --debug, --apt-debug,
// --verbose, --dry-run, --download-only and the two --minimal-upgrade-steps forms; there is no way to
// hand it an apt setting on the command line. apt reads the file named by APT_CONFIG first, then
// /etc/apt/apt.conf.d, then /etc/apt/apt.conf — so an administrator's own settings still land on top of
// these, and Dpkg::Options is a list that accumulates rather than being replaced.
//
// Without the two conffile options, unattended-upgrade does not hang. What it does is worse and much
// quieter: dpkg_conffile_prompt() returns true, and every package whose conffile has been edited
// locally goes on a blacklist and is skipped, while the rest are upgraded and the run reports success.
// The host then stays vulnerable in exactly the packages somebody cared enough about to edit.
//
// --force-confdef takes the package maintainer's default where one exists; --force-confold keeps the
// administrator's file where it does not. Together they mean "never ask, and never overwrite a local
// edit". testfleet/scenarios/050-conffile-prompt.sh asserts both halves against real dpkg.
Dpkg::Options {
	"--force-confdef";
	"--force-confold";
};

// Wait for the dpkg lock rather than failing. Colliding with the host's own apt-daily.timer is the
// failure that only appears on a busy fleet, and it appears as a job that failed for no reason anybody
// can see. Ten minutes is longer than any apt-daily run, and a genuinely wedged lock is still reported
// within the job's own timeout.
DPkg::Lock::Timeout "600";
