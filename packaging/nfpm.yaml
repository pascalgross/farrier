# nfpm configuration for the hostseal-agent Debian package.
#
# Packaging is built in phase 0, before there is anything to carry, because it is where greenfield
# agent projects lose weeks. Proving the .deb installs, the user is created, the hardened unit starts,
# the conffiles survive an upgrade and the repository signs correctly is much cheaper against a binary
# that only logs than against one that also has a protocol to debug.
#
# Environment: VERSION, ARCH and DIST. `make deb` sets all three.

name: hostseal-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: Pascal Groß <hostseal@hostseal.io>
vendor: Pascal Groß
homepage: https://github.com/pascalgross/hostseal
license: Apache-2.0

description: |
  Fleet management agent for Ubuntu and Debian servers, without a remote shell.
  .
  HostSeal reports inventory, systemd service state and pending package updates to a
  control plane, and applies updates within a policy this host controls. The agent
  connects outbound only and has no listening port.
  .
  It runs a closed, enumerated set of typed operations: there is no command channel,
  no script execution and no plugin loader. Every privileged operation is bounded by
  /etc/hostseal/policy.toml, which the control plane cannot modify, and every
  destructive one requires a signature from a key listed in
  /etc/hostseal/trusted-signers, which the control plane does not hold. Both files are
  conffiles and are empty of permissions by default: a freshly installed agent will
  report on this host and keep it patched, and will do nothing else until an
  administrator says otherwise.

depends:
  - adduser
  # Not merely for the agent's own unit: the privilege boundary between the agent and the three root
  # helpers *is* systemd socket activation. There is no sudo here, and no setuid binary, so there is
  # nothing to fall back to on a host without it.
  - systemd
recommends:
  # unattended-upgrades is what actually applies updates, and its origin filtering is
  # correct on both distribution families. HostSeal wraps it rather than reimplementing
  # it, because a second implementation would be wrong on exactly the release nobody
  # tested.
  - unattended-upgrades
  # needrestart answers "which running services still hold the replaced library",
  # which is more actionable than reboot-required and is what most update dashboards
  # skip. On Debian it is also the reliable source for whether a reboot is needed at
  # all, since /var/run/reboot-required is an Ubuntu update-notifier convention.
  - needrestart
suggests:
  # apt-check lives here and is absent from minimal images of both families. HostSeal
  # treats it as an optimisation: the simulated-upgrade parse is the primary path,
  # because a host without this package must not silently report zero updates.
  - update-notifier-common

contents:
  - src: ../dist/hostseal-agent
    dst: /usr/bin/hostseal-agent
    file_info:
      mode: 0755

  # The operator's CLI. It is in the agent package rather than one of its own because the very first
  # thing anybody does on a managed host is run `hostseal enroll`, and a host that cannot enrol is a
  # host the package did not finish installing. It is also what prints the trusted-signers line, which
  # the shipped conffile tells the administrator to run.
  - src: ../dist/hostseal
    dst: /usr/bin/hostseal
    file_info:
      mode: 0755

  # The three root helpers. There is no fourth, and none of them accepts a command to
  # run. Each re-reads and re-enforces /etc/hostseal/policy.toml itself, as root, which
  # is what bounds a fully compromised agent process. They are not setuid and never
  # will be: systemd starts them, as root, on a connection to their socket.
  - src: ../dist/apply-updates
    dst: /usr/libexec/hostseal/apply-updates
    file_info:
      mode: 0755
  - src: ../dist/restart-unit
    dst: /usr/libexec/hostseal/restart-unit
    file_info:
      mode: 0755
  - src: ../dist/reboot-host
    dst: /usr/libexec/hostseal/reboot-host
    file_info:
      mode: 0755

  - src: ./hostseal-agent.service
    dst: /usr/lib/systemd/system/hostseal-agent.service
    file_info:
      mode: 0644

  # The privilege boundary. One socket per helper, owned root:hostseal and mode 0660, each activating
  # one instance of one helper per connection. This is what replaced /etc/sudoers.d/hostseal: sudo
  # cannot become root from inside the agent's sandbox, because NoNewPrivileges makes execve drop the
  # setuid bit, and systemd implies that setting from eight directives the unit sets.
  - src: ./hostseal-apply-updates.socket
    dst: /usr/lib/systemd/system/hostseal-apply-updates.socket
    file_info:
      mode: 0644
  - src: ./hostseal-apply-updates@.service
    dst: /usr/lib/systemd/system/hostseal-apply-updates@.service
    file_info:
      mode: 0644
  - src: ./hostseal-restart-unit.socket
    dst: /usr/lib/systemd/system/hostseal-restart-unit.socket
    file_info:
      mode: 0644
  - src: ./hostseal-restart-unit@.service
    dst: /usr/lib/systemd/system/hostseal-restart-unit@.service
    file_info:
      mode: 0644
  - src: ./hostseal-reboot-host.socket
    dst: /usr/lib/systemd/system/hostseal-reboot-host.socket
    file_info:
      mode: 0644
  - src: ./hostseal-reboot-host@.service
    dst: /usr/lib/systemd/system/hostseal-reboot-host@.service
    file_info:
      mode: 0644

  # /run is a tmpfs, so the directory the sockets live in has to be recreated on every boot, before
  # sockets.target.
  - src: ./hostseal-tmpfiles.conf
    dst: /usr/lib/tmpfiles.d/hostseal.conf
    file_info:
      mode: 0644

  # Named by APT_CONFIG when a helper applies updates, and deliberately NOT installed into
  # /etc/apt/apt.conf.d: HostSeal configures nothing about the host's own apt. It carries
  # --force-confdef and --force-confold, without which unattended-upgrade silently holds back every
  # package whose conffile was edited locally — and reports success.
  - src: ./apt.conf
    dst: /usr/share/hostseal/apt.conf
    file_info:
      mode: 0644

  # Both of these are conffiles. dpkg must never replace a local edit, and testfleet/
  # asserts it does not — for trusted-signers that is a security test, not a
  # convenience test.
  - src: ./policy.toml
    dst: /etc/hostseal/policy.toml
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./trusted-signers
    dst: /etc/hostseal/trusted-signers
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ../LICENSE
    dst: /usr/share/doc/hostseal-agent/copyright
  # Apache-2.0 §4(d) requires the NOTICE file to travel with any distribution of the work, and the
  # .deb is one. It is also where the copyright line — Pascal Groß and the HostSeal contributors —
  # reaches a host, since `copyright` above is the bare licence text.
  - src: ../NOTICE
    dst: /usr/share/doc/hostseal-agent/NOTICE
  - src: ../docs/SECURITY.md
    dst: /usr/share/doc/hostseal-agent/SECURITY.md
  - src: ../docs/PROTOCOL.md
    dst: /usr/share/doc/hostseal-agent/PROTOCOL.md
  - src: ../README.md
    dst: /usr/share/doc/hostseal-agent/README.md

  - dst: /var/lib/hostseal
    type: dir
    file_info:
      mode: 0750
      owner: hostseal
      group: hostseal
  # Job results are written here and fsynced before a reboot is invoked, then
  # delivered on next start. Without that ordering, host.reboot completes by the host
  # disappearing and reports nothing at all.
  - dst: /var/lib/hostseal/pending-results
    type: dir
    file_info:
      mode: 0750
      owner: hostseal
      group: hostseal
  - dst: /var/log/hostseal
    type: dir
    file_info:
      mode: 0750
      owner: hostseal
      group: hostseal

scripts:
  preinstall: ./scripts/preinst.sh
  postinstall: ./scripts/postinst.sh
  preremove: ./scripts/prerm.sh
  postremove: ./scripts/postrm.sh

deb:
  fields:
    Bugs: https://github.com/pascalgross/hostseal/issues
